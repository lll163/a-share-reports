<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(0,0,0,0.5)"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="1200" height="630" fill="url(#bg)" rx="0"/>
  
  <!-- 装饰线条 -->
  <line x1="60" y1="120" x2="1140" y2="120" stroke="#888888" stroke-width="2" opacity="0.3"/>
  <line x1="60" y1="520" x2="1140" y2="520" stroke="#888888" stroke-width="1" opacity="0.2"/>
  
  <!-- 左上角装饰点 -->
  <circle cx="80" cy="80" r="6" fill="#888888" opacity="0.8"/>
  <circle cx="100" cy="80" r="6" fill="#888888" opacity="0.5"/>
  <circle cx="120" cy="80" r="6" fill="#888888" opacity="0.3"/>
  
  <!-- 标题 -->
  <text x="600" y="280" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="72" font-weight="bold" fill="white" text-anchor="middle" filter="url(#shadow)">
    📊 A股复盘
  </text>
  
  <!-- 副标题/数据 -->
  <text x="600" y="370" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="36" fill="#888888" text-anchor="middle" opacity="0.9">
    2026-08-14
  </text>
  
  <!-- 底部装饰 -->
  <rect x="450" y="560" width="300" height="4" fill="#888888" rx="2" opacity="0.4"/>
</svg>